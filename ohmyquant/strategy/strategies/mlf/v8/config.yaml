# ML 选因子策略 v8 配置
#
# 基于 v5 超参网格搜索最优配置（收益最高）：
#   - top_n: 20 (更集中)
#   - top_k_factors: 30 (更多因子)
#   - max_industry_weight: 25% (更松约束)
# 网格搜索 27 组合: +11.65%, Sharpe 5.39

strategy_type: mlf
strategy_version: v8
strategy_name: "ML选因子策略 v8"
description: "网格搜索最优：20只股票+30因子+25%行业(k30_w1008_csi300_n20_ind25)"

backtest:
  start_date: "2018-01-01"
  end_date: "2026-05-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.0008

selection:
  method: mlf
  top_n: 20
  max_stock_weight: 0.04
  mlf:
    data_root: "D:/Work/Project/download_a_share/data"
    top_k_factors: 30
    train_window: 1008
    retrain_freq: 21
    target_horizon: 20
    neutralize: true
    max_industry_weight: 0.25

portfolio:
  max_stock_weight: 0.04

risk:
  method: vol_target
  target_vol: 0.18
  lookback: 20
  min_exposure_scale: 0.5

rebalance:
  frequency: monthly
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
