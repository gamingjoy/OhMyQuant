# 行业轮动策略 v10 配置（残差动量 + 中证500候选池）
# A方向：基于华泰金工《残差动量行业轮动》思路
# 核心：用 raw_beta 因子剔除市场Beta暴露，得到特异性动量
# 研报参考：年化超额12.90%
strategy_type: industry_rotation
strategy_version: v10
strategy_name: "行业轮动策略 industry_rotation_v10 (residual_mom_csi500_rrg220_30, iter)"
description: "残差动量+中证500候选池:12因子+RRG+绝对动量+残差动量(剔除市场Beta)+行业风险过滤 [iter]"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.25
    market_filter: true
    market_index: "000905.XSHG"  # 中证500作为大盘指数（与候选池一致）
    market_ma_short: 5
    market_ma_long: 20
    # 行业短期风险过滤
    industry_risk_filter: true
    risk_filter_window: 20
    risk_filter_min_industries: 3
    # 绝对动量（Dual Momentum）
    absolute_momentum: true
    absolute_momentum_window: 20
    absolute_momentum_threshold: -0.03
    absolute_momentum_scale: 0.5
    use_inv_vol_weight: false
    inv_vol_window: 20
    # RRG 框架
    use_rrg: true
    rs_ratio_window: 220
    rs_momentum_window: 30
    rrg_momentum_threshold: 100.0
    rrg_min_industries: 3
    # 残差动量（NEW in v10, 华泰金工）
    # residual_return = stock_return - raw_beta * market_return
    # 剔除市场Beta后的特异性动量，避免高Beta股虚假动量
    use_residual_momentum: true
    residual_beta_factor: "raw_beta"
    residual_beta_default: 1.0
    # 多因子选股
    use_factors: true
    factor_names:
      - Price1M
      - Price3M
      - ROC20
      - DAVOL10
      - money_flow_20
      - gross_income_ratio
      - roe_ttm
      - net_profit_ratio
      - earnings_to_price_ratio
      - book_to_price_ratio
      - raw_beta
      - residual_volatility
    factor_weights:
      Price1M: 1.0
      Price3M: 1.0
      ROC20: 1.0
      DAVOL10: 1.0
      money_flow_20: 1.0
      gross_income_ratio: 1.0
      roe_ttm: 1.0
      net_profit_ratio: 1.0
      earnings_to_price_ratio: 1.0
      book_to_price_ratio: 1.0
      raw_beta: -2.0
      residual_volatility: -1.5

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.25
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000905.XSHG"  # 中证500候选池（D方向对比最优）

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
