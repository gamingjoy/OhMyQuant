# 行业轮动策略 v50 配置（IC乘数模式：保留静态权重结构）—— [ITER]
# v50 = v43 + use_ic_weighting + ic_weighting_mode="multiplier" + scale=0.5 + lookback=120 + horizon=20
# baseline: v43 (IS Sharpe 0.5716 / 2024 Sharpe 0.1053 / 2025 Sharpe 2.0319)
# v49失败教训: IC直接替代静态权重导致信息丢失(IS 0.5716→0.0736)
strategy_type: industry_rotation
strategy_version: v50
strategy_name: "行业轮动策略 industry_rotation_v50 (ic_multiplier, iter)"
description: "v43+IC乘数(scale=0.5,lookback=120,horizon=20) [iter]"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 3
    stocks_per_industry: 3
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30
    market_filter: true
    market_index: "000300.XSHG"
    market_ma_short: 10
    market_ma_long: 30
    industry_risk_filter: true
    risk_filter_window: 20
    risk_filter_min_industries: 3
    absolute_momentum: true
    absolute_momentum_window: 20
    absolute_momentum_threshold: -0.03
    absolute_momentum_scale: 0.5
    use_inv_vol_weight: false
    inv_vol_window: 20
    use_rrg: true
    rs_ratio_window: 220
    rs_momentum_window: 30
    rs_momentum_windows: [10, 30, 60]
    rs_momentum_vote_threshold: 2
    rs_momentum_vote_weights: [0.3, 0.4, 0.3]
    rrg_momentum_threshold: 100.0
    rrg_min_industries: 3
    use_pe_filter: true
    pe_factor: "earnings_to_price_ratio"
    pe_lookback: 250
    pe_expensive_percentile: 0.10
    pe_min_industries: 3
    use_pe_adjusted_rrg_vote: true
    pe_vote_adjust_alpha: 0.2
    use_factors: true
    # NEW in v50: IC乘数模式（保留静态权重结构）
    use_ic_weighting: true
    ic_weighting_mode: "multiplier"
    ic_weight_scale: 0.5
    ic_lookback: 120
    ic_horizon: 20
    factor_names:
      - Price1M
      - Price3M
      - ROC20
      - DAVOL10
      - money_flow_20
      - gross_income_ratio
      - roe_ttm
      - net_profit_ratio
      - earnings_to_price_ratio
      - book_to_price_ratio
      - raw_beta
      - residual_volatility
    factor_weights:
      Price1M: 1.0
      Price3M: 1.0
      ROC20: 1.0
      DAVOL10: 1.0
      money_flow_20: 1.0
      gross_income_ratio: 1.0
      roe_ttm: 1.0
      net_profit_ratio: 1.0
      earnings_to_price_ratio: 1.0
      book_to_price_ratio: 1.0
      raw_beta: -2.0
      residual_volatility: -1.5

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
