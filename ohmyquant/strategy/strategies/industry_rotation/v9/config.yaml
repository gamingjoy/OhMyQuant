# 行业轮动策略 v9 配置（RRG 相对强度动量, iter）
strategy_type: industry_rotation
strategy_version: v9
strategy_name: "行业轮动策略 industry_rotation_v9 (mf12_lowbeta_riskfilter20_dualmom20_rrg220_30, iter)"
description: "RRG相对强度动量:12因子+行业风险过滤+绝对动量+RRG(RS-Ratio220日+RS-Momentum30日)领先象限+沪深300 [iter]"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.25
    market_filter: true
    market_index: "000300.XSHG"
    market_ma_short: 5
    market_ma_long: 20
    # 行业短期风险过滤：剔除20日内下跌的行业
    industry_risk_filter: true
    risk_filter_window: 20
    risk_filter_min_industries: 3
    # 绝对动量（Dual Momentum）：20日收益<-3%时仓位×0.5（温和降仓）
    absolute_momentum: true
    absolute_momentum_window: 20
    absolute_momentum_threshold: -0.03
    absolute_momentum_scale: 0.5
    # 逆波动率加权——经测试损害IS Sharpe，已禁用
    use_inv_vol_weight: false
    inv_vol_window: 20
    # RRG 框架（Relative Rotation Graph, NEW in v9）
    # RS-Ratio = 行业均价/沪深300 的 220 日标准化值，>100 表示长期跑赢大盘
    # RS-Momentum = RS-Ratio 的 30 日动量，>100 表示相对强度在加速
    # 行业选择：先按 RS-Ratio 取候选，再剔除 RS-Momentum<100 的疲软象限
    # 参考：2026 量化轮动策略报告（RRG 框架），年化18.34%, Sharpe 0.72
    # 30日窗口能在6/22 OOS识别建筑材料短期转弱（RS-Mom=97.34<100），60日窗口反应过慢
    use_rrg: true
    rs_ratio_window: 220
    rs_momentum_window: 30
    rrg_momentum_threshold: 100.0
    rrg_min_industries: 3
    use_factors: true
    factor_names:
      - Price1M
      - Price3M
      - ROC20
      - DAVOL10
      - money_flow_20
      - gross_income_ratio
      - roe_ttm
      - net_profit_ratio
      - earnings_to_price_ratio
      - book_to_price_ratio
      - raw_beta
      - residual_volatility
    factor_weights:
      Price1M: 1.0
      Price3M: 1.0
      ROC20: 1.0
      DAVOL10: 1.0
      money_flow_20: 1.0
      gross_income_ratio: 1.0
      roe_ttm: 1.0
      net_profit_ratio: 1.0
      earnings_to_price_ratio: 1.0
      book_to_price_ratio: 1.0
      raw_beta: -2.0
      residual_volatility: -1.5

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.25
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
