# 行业轮动策略 v5 配置（多因子选股+聚宽260因子）
#
# v4 问题：个股层仅用价格动量，忽略聚宽因子数据
# v5 改进：
#   - 个股层改用多因子复合评分（动量+成交量+质量+价值）
#   - 行业层保持动量排名（已验证有效）
#   - 大盘过滤 ma_long=20（网格搜索最优）
#   - 充分利用聚宽260因子数据

strategy_type: industry_rotation
strategy_version: v5
strategy_name: "行业轮动策略 v5"
description: "多因子选股：60+120日行业动量+10因子个股评分,大盘20日过滤,沪深300"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30
    market_filter: true
    market_index: "000300.XSHG"
    market_ma_short: 10
    market_ma_long: 20
    # 多因子选股
    use_factors: true
    factor_names:
      # 动量类
      - Price1M
      - Price3M
      - ROC20
      # 成交量类
      - DAVOL10
      - money_flow_20
      # 质量类
      - gross_income_ratio
      - roe_ttm
      - net_profit_ratio
      # 价值类
      - earnings_to_price_ratio
      - book_to_price_ratio
    factor_weights:
      Price1M: 1.0
      Price3M: 1.0
      ROC20: 1.0
      DAVOL10: 1.0
      money_flow_20: 1.0
      gross_income_ratio: 1.0
      roe_ttm: 1.0
      net_profit_ratio: 1.0
      earnings_to_price_ratio: 1.0
      book_to_price_ratio: 1.0

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
