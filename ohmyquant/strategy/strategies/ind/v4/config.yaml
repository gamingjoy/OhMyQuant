# 行业轮动策略 v4 配置（敏感大盘过滤+低波动率目标）
#
# v3 问题：回撤仍大(-24.8%)
# v4 改进：大盘过滤更敏感(10/20日) + 波动率目标更低(0.12)

strategy_type: ind
strategy_version: v4
strategy_name: "行业轮动策略 v4"
description: "敏感大盘过滤+低波动率：60+120日动量,大盘10/20日过滤,vol_target0.12"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: ind
  top_n: 10
  max_stock_weight: 0.10
  ind:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30
    market_filter: true
    market_index: "000300.XSHG"
    market_ma_short: 10
    market_ma_long: 20

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
