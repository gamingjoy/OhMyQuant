# 行业轮动策略 v2 配置（周频+波动率目标）
#
# v1 问题：日频调仓换手成本高 + drawdown 风控过度降仓 → -6.27%
# v2 改进：周频调仓 + vol_target 风控

strategy_type: industry_rotation
strategy_version: v2
strategy_name: "行业轮动策略 v2"
description: "周频调仓+波动率目标：20+60日动量,Top5行业×2股,沪深300,vol_target0.15"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 20
    momentum_long: 60
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: vol_target
  target_vol: 0.15
  lookback: 20
  min_exposure_scale: 0.5

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
