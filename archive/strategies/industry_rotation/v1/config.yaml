# 行业轮动策略 v1 配置（基线版）
#
# 基于行业动量的行业轮动策略：
#   - 20日动量(0.6) + 60日动量(0.4) → 行业综合动量
#   - 选 Top-5 行业，每行业选 Top-2 股票（共10只）
#   - 单股 ≤ 10%，日频调仓，回撤防御风控
#   - 基线：沪深300

strategy_type: industry_rotation
strategy_version: v1
strategy_name: "行业轮动策略 v1"
description: "行业动量基线：20+60日动量,Top5行业×2股,沪深300,日频调仓,回撤防御"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 20
    momentum_long: 60
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: drawdown
  target_vol: 0.20
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: daily
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
