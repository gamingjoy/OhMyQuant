# 行业轮动策略 v8 配置（ML选股增强+截面z-score+长训练窗口）
#
# v7 问题：ML用原始因子值训练，未做截面标准化
# v8 改进：
#   - 截面 z-score 标准化（每个日期内标准化因子值）
#   - 更长训练窗口：252 → 504 天
#   - 更多树+更低学习率：300树, 0.03

strategy_type: industry_rotation
strategy_version: v8
strategy_name: "行业轮动策略 v8"
description: "ML增强：60+120日行业动量+LightGBM(z-score,504天,300树),大盘20日过滤"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: industry_rotation
  top_n: 10
  max_stock_weight: 0.10
  industry_rotation:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30
    market_filter: true
    market_index: "000300.XSHG"
    market_ma_short: 10
    market_ma_long: 20
    use_ml: true
    use_factors: true
    factor_names:
      - Price1M
      - Price3M
      - ROC20
      - DAVOL10
      - money_flow_20
      - gross_income_ratio
      - roe_ttm
      - net_profit_ratio
      - earnings_to_price_ratio
      - book_to_price_ratio
    factor_weights:
      Price1M: 1.0
      Price3M: 1.0
      ROC20: 1.0
      DAVOL10: 1.0
      money_flow_20: 1.0
      gross_income_ratio: 1.0
      roe_ttm: 1.0
      net_profit_ratio: 1.0
      earnings_to_price_ratio: 1.0
      book_to_price_ratio: 1.0
    ml_train_window: 504
    ml_retrain_freq: 21
    ml_target_horizon: 20
    ml_n_estimators: 300
    ml_max_depth: 3
    ml_learning_rate: 0.03

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
