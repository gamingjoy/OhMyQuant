# 行业轮动策略 v7 配置（ML选股+LightGBM预测收益）
#
# v5 问题：10因子等权线性组合，无法捕捉因子间非线性关系
# v6 问题：手动调权重全面恶化，说明线性加权难以优化
# v7 改进：
#   - 用LightGBM回归模型学习因子→未来收益的非线性关系
#   - 滚动训练（252天窗口，每21天重训练）
#   - 预测20日未来收益作为个股评分
#   - 因子集沿用v5的10因子（已验证有效）

strategy_type: ind
strategy_version: v7
strategy_name: "行业轮动策略 v7"
description: "ML选股：60+120日行业动量+LightGBM预测收益(10因子),大盘20日过滤"

backtest:
  start_date: "2022-01-01"
  end_date: "2025-12-31"
  data_start_date: "2018-01-01"
  transaction_cost: 0.001

selection:
  method: ind
  top_n: 10
  max_stock_weight: 0.10
  ind:
    data_root: "D:/Work/Project/download_a_share/data"
    top_industries: 5
    stocks_per_industry: 2
    momentum_short: 60
    momentum_long: 120
    weight_short: 0.6
    weight_long: 0.4
    max_industry_weight: 0.30
    market_filter: true
    market_index: "000300.XSHG"
    market_ma_short: 10
    market_ma_long: 20
    # ML选股
    use_ml: true
    use_factors: true  # ML失败时回退
    factor_names:
      # 动量类
      - Price1M
      - Price3M
      - ROC20
      # 成交量类
      - DAVOL10
      - money_flow_20
      # 质量类
      - gross_income_ratio
      - roe_ttm
      - net_profit_ratio
      # 价值类
      - earnings_to_price_ratio
      - book_to_price_ratio
    factor_weights:  # 回退用
      Price1M: 1.0
      Price3M: 1.0
      ROC20: 1.0
      DAVOL10: 1.0
      money_flow_20: 1.0
      gross_income_ratio: 1.0
      roe_ttm: 1.0
      net_profit_ratio: 1.0
      earnings_to_price_ratio: 1.0
      book_to_price_ratio: 1.0
    # ML参数
    ml_train_window: 252
    ml_retrain_freq: 21
    ml_target_horizon: 20
    ml_n_estimators: 150
    ml_max_depth: 3
    ml_learning_rate: 0.05

portfolio:
  max_stock_weight: 0.10
  max_industry_weight: 0.30
  min_stocks: 5

risk:
  method: regime_adaptive
  target_vol: 0.12
  lookback: 20
  min_exposure_scale: 0.3

rebalance:
  frequency: weekly
  weekday: 0
  method: cost_benefit
  cost_model:
    name: stock_cn

factors:
  - mom_1m

pools:
  stocks:
    index: "000300.XSHG"

data:
  source: duckdb
  data_root: "D:/Work/Project/download_a_share/data"
