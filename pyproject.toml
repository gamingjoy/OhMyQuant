[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmyquant"
version = "0.1.0"
description = "一站式量化策略开发框架 — 从数据到策略，从回测到实盘"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OhMyQuant" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "polars>=0.20.0",
    "duckdb>=0.9.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0.0", "xgboost>=2.0.0"]
dl = ["torch>=2.0.0"]
rl = ["stable-baselines3>=2.0.0", "gymnasium>=0.28.0"]
viz = ["plotly>=5.0.0"]
stats = ["scipy>=1.10.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff", "mypy", "pre-commit"]
all = [
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.0.0",
    "gymnasium>=0.28.0",
    "plotly>=5.0.0",
    "scipy>=1.10.0",
]

[project.scripts]
omq = "ohmyquant.cli:main"

[tool.setuptools.packages.find]
include = ["ohmyquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
